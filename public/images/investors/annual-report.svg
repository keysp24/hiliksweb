<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 225" width="400" height="225">
  <defs>
    <linearGradient id="a-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F131A"/>
      <stop offset="50%" stop-color="#121822"/>
      <stop offset="100%" stop-color="#0B0D11"/>
    </linearGradient>
    <linearGradient id="a-glass" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.10)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.03)"/>
    </linearGradient>
    <linearGradient id="a-glass2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(255,255,255,0.06)"/>
      <stop offset="100%" stop-color="rgba(255,255,255,0.01)"/>
    </linearGradient>
    <linearGradient id="a-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2680E"/>
      <stop offset="50%" stop-color="#9B6BFF"/>
      <stop offset="100%" stop-color="#2E8FE0"/>
    </linearGradient>
    <filter id="a-blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="20"/>
    </filter>
  </defs>
  <rect width="400" height="225" fill="url(#a-bg)"/>
  
  <!-- ambient glows -->
  <circle cx="100" cy="60" r="80" fill="#9B6BFF" opacity="0.10" filter="url(#a-blur)"/>
  <circle cx="320" cy="170" r="70" fill="#F2680E" opacity="0.10" filter="url(#a-blur)"/>
  
  <!-- grid -->
  <g opacity="0.05">
    <path d="M0 45h400M0 90h400M0 135h400M0 180h400" stroke="#EEF2F7" stroke-width="1"/>
  </g>
  
  <!-- main document glass -->
  <rect x="105" y="35" width="130" height="155" rx="12" fill="url(#a-glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <rect x="105" y="35" width="130" height="50" rx="12" fill="rgba(255,255,255,0.04)"/>
  
  <!-- document lines -->
  <rect x="125" y="58" width="70" height="6" rx="3" fill="#F2680E" opacity="0.9"/>
  <rect x="125" y="75" width="90" height="4" rx="2" fill="#5E6B7C" opacity="0.5"/>
  <rect x="125" y="85" width="80" height="4" rx="2" fill="#5E6B7C" opacity="0.35"/>
  <rect x="125" y="95" width="85" height="4" rx="2" fill="#5E6B7C" opacity="0.35"/>
  
  <!-- mini glass chart inside doc -->
  <rect x="125" y="115" width="90" height="55" rx="8" fill="url(#a-glass2)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  <path d="M138 155 L155 140 L172 148 L190 128 L208 138" fill="none" stroke="#F2680E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="138" cy="155" r="3" fill="#F2680E"/>
  <circle cx="155" cy="140" r="3" fill="#F2680E"/>
  <circle cx="172" cy="148" r="3" fill="#F2680E"/>
  <circle cx="190" cy="128" r="3" fill="#F2680E"/>
  <circle cx="208" cy="138" r="3" fill="#F2680E"/>
  
  <!-- glass donut chart -->
  <circle cx="285" cy="110" r="48" fill="none" stroke="#212A36" stroke-width="16"/>
  <circle cx="285" cy="110" r="48" fill="none" stroke="url(#a-ring)" stroke-width="16" stroke-dasharray="190 110" stroke-linecap="round" transform="rotate(-90 285 110)"/>
  <circle cx="285" cy="110" r="48" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="16" stroke-dasharray="190 110" stroke-linecap="round" transform="rotate(-90 285 110)"/>
  
  <!-- center badge -->
  <circle cx="285" cy="110" r="30" fill="url(#a-glass)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="285" y="106" text-anchor="middle" font-family="Sora, sans-serif" font-size="10" font-weight="600" fill="#94A1B2">FY</text>
  <text x="285" y="120" text-anchor="middle" font-family="Sora, sans-serif" font-size="16" font-weight="700" fill="#EEF2F7">25</text>
  
  <!-- floating glass chip -->
  <rect x="260" y="165" width="70" height="28" rx="14" fill="rgba(242,104,14,0.15)" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
  <text x="295" y="183" text-anchor="middle" font-family="Sora, sans-serif" font-size="9" font-weight="600" fill="#FF9248">ANNUAL</text>
  
  <text x="200" y="210" text-anchor="middle" font-family="Sora, sans-serif" font-size="12" font-weight="600" fill="#94A1B2" letter-spacing="0.08em">ANNUAL REPORT</text>
</svg>